name: Build BChat Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      continue-on-error: true

    - name: Create Dummy Google Services JSON
      run: |
        if [ ! -f app/google-services.json ]; then
          echo '{"project_info":{"project_number":"123","project_id":"dummy"},"client":[{"client_info":{"mobilesdk_app_id":"1:123:android:123","android_client_info":{"package_name":"com.bchat.app"}},"api_key":[{"current_key":"dummy"}]}]}' > app/google-services.json
        fi

    - name: Fix corrupted mipmap PNGs
      run: |
        # Re-encode any PNG that AAPT2 strict mode would reject.
        # Uses ImageMagick (pre-installed on ubuntu-latest) to re-export a clean PNG.
        sudo apt-get install -y imagemagick 2>/dev/null || true
        find app/src/main/res/mipmap-* -name "*.png" | while read f; do
          convert "$f" "$f" 2>/dev/null || true
        done

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK (unsigned)
      run: ./gradlew assembleRelease

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: bchat-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: bchat-release-apk
        path: app/build/outputs/apk/release/app-release-unsigned.apk
